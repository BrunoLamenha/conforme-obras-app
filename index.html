<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conforme Obras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="logo.png" alt="Conforme Obras" class="logo-img">
            <h1>CONFORME OBRA</h1>
            <p>Sistema Integrado de Gestão e Vistoria</p>
        </header>
        
        <main class="menu-inicial">
            <button class="btn-primary" onclick="navegar('vistoria')">
                <h2>VISTORIA</h2>
                <span>Acompanhamento de campo, estrutura e acabamentos</span>
            </button>
            
            <button class="btn-secondary" onclick="navegar('cadastros')">
                <h2>CADASTROS</h2>
                <span>Gerenciamento de empreendimentos e configurações</span>
            </button>
        </main>
    </div>
    <!-- Área de Upload Simplificada -->
<div class="upload-container">
    <h3>Upload de Projeto</h3>
    
    <select id="selectPavimento">
        <option value="terreo">Térreo</option>
        <option value="1_andar">1º Pavimento</option>
        <option value="2_andar">2º Pavimento</option>
        <option value="cobertura">Cobertura</option>
    </select>

    <input type="file" id="pdfFile" accept="application/pdf">
    <button id="uploadBtn">Enviar Arquivo</button>
</div>

    <script type="module" src="script.js"></script>
    <div class="upload-container">
    <h3>Gerenciamento de Projetos por Pavimento</h3>
    
    <select id="selectPavimento">
        <option value="terreo">Térreo</option>
        <option value="1_andar">1º Pavimento</option>
        <option value="2_andar">2º Pavimento</option>
        <option value="cobertura">Cobertura</option>
    </select>

    <input type="file" id="pdfFile" accept="application/pdf">
    <button id="uploadBtn">Enviar Arquivo</button>

    <!-- Área onde a lista de arquivos vai aparecer -->
    <div class="arquivos-list-section">
        <h4>Projetos em PDF Disponíveis</h4>
        <ul id="listaArquivos">
            <li>Selecione um pavimento para carregar os projetos.</li>
        </ul>
    </div>
</div>
</body>
</html>
