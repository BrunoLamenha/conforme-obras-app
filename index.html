<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conforme Obras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="logo.png" alt="Conforme Obras" class="logo-img">
            <h1>CONFORME OBRA</h1>
            <p>Sistema Integrado de Gestão e Vistoria</p>
        </header>
        
 <div class="upload-section">
  <label for="pdfFile">Enviar Projeto PDF:</label>
  <input type="file" id="pdfFile" accept="application/pdf">
  <button id="uploadBtn">Fazer Upload</button>
</div>
        
        <main class="menu-inicial">
            <button class="btn-primary" onclick="navegar('vistoria')">
                <h2>VISTORIA</h2>
                <span>Acompanhamento de campo, estrutura e acabamentos</span>
            </button>
            
            <button class="btn-secondary" onclick="navegar('cadastros')">
                <h2>CADASTROS</h2>
                <span>Gerenciamento de empreendimentos e configurações</span>
            </button>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
