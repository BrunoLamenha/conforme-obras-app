<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conforme Obras</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="./manifest.json">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-wrapper">
                <img src="logo.png" alt="Conforme Obras" class="logo-img">
            </div>
            <div class="header-titles">
                <h1>CONFORME OBRA</h1>
                <p>Sistema Integrado de Gestão e Vistoria</p>
            </div>
        </header>
        
        <main id="main-content">
            <!-- SEÇÃO 1: MENU INICIAL -->
            <section id="screen-menu" class="menu-inicial">
                <div class="card-menu" data-target="vistoria">
                    <div class="card-icon"><i class="fa-solid fa-clipboard-check"></i></div>
                    <div class="card-info">
                        <h2>VISTORIA</h2>
                        <span>Acompanhamento de campo, estrutura e acabamentos</span>
                    </div>
                    <div class="card-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                </div>
                
                <div class="card-menu" data-target="cadastros">
                    <div class="card-icon"><i class="fa-solid fa-building-shield"></i></div>
                    <div class="card-info">
                        <h2>CADASTROS</h2>
                        <span>Gerenciamento de empreendimentos, projetos e configurações</span>
                    </div>
                    <div class="card-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                </div>
            </section>

            <!-- SEÇÃO 2: WIZARD DE VISTORIA (Oculto por padrão via CSS) -->
            <section id="screen-wizard" class="wizard-screen hidden">
                <div class="card" id="type-card">
                    <h3>3. Tipo de Vistoria</h3>
                    <div class="button-group" id="category-selection-container">
                        <button class="tab-btn btn-opt" id="btn-cat-padrao" data-category="Padrão Construtora">Padrão Construtora</button>
                        <button class="tab-btn btn-opt" id="btn-cat-reforma" data-category="Reforma / Aditivo">Reforma / Aditivo</button>
                    </div>

                    <h3>4. Etapa da Vistoria</h3>
                    <div class="button-group" id="stage-selection-container">
                        <button class="btn btn-stage" id="btn-stage-1" data-stage="1ª Vistoria">📋 1ª Vistoria</button>
                        <button class="btn btn-stage hidden" id="btn-stage-rev" data-stage="Revistoria">🔄 Revistoria</button>
                    </div>
                    <div id="stage-info-text" class="stage-info"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Ponto de entrada do JavaScript modular -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
