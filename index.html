<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conforme Obras</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="./manifest.json">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-wrapper">
                <img src="logo.png" alt="Conforme Obras" class="logo-img">
            </div>
            <div class="header-titles">
                <h1>CONFORME OBRA</h1>
                <p>Sistema Integrado de Gestão e Vistoria</p>
            </div>
        </header>
        
        <main id="main-content" class="menu-inicial">
            <div class="card-menu" onclick="navegar('vistoria')">
                <div class="card-icon"><i class="fa-solid fa-clipboard-check"></i></div>
                <div class="card-info">
                    <h2>VISTORIA</h2>
                    <span>Acompanhamento de campo, estrutura e acabamentos</span>
                </div>
                <div class="card-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
            
            <div class="card-menu" onclick="navegar('cadastros')">
                <div class="card-icon"><i class="fa-solid fa-building-shield"></i></div>
                <div class="card-info">
                    <h2>CADASTROS</h2>
                    <span>Gerenciamento de empreendimentos, projetos e configurações</span>
                </div>
                <div class="card-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
        </main>
    </div>
    <div class="card" id="type-card" style="display:none;">
    <h3>3. Tipo de Vistoria</h3>
    <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;" id="category-selection-container">
        <button class="tab-btn btn-opt" style="flex:1; min-width:140px;" id="btn-cat-padrao" onclick="setCategory('Padrão Construtora', this)">Padrão Construtora</button>
        <button class="tab-btn btn-opt" style="flex:1; min-width:140px;" id="btn-cat-reforma" onclick="setCategory('Reforma / Aditivo', this)">Reforma / Aditivo</button>
    </div>

    <h3 style="margin-top: 15px;">4. Etapa da Vistoria</h3>
    <div style="display:flex; gap:8px; margin-top:8px;" id="stage-selection-container">
        <button class="btn btn-stage" id="btn-stage-1" style="flex:1;" onclick="setStage('1ª Vistoria', this)">📋 1ª Vistoria</button>
        <button class="btn btn-stage" id="btn-stage-rev" style="flex:1; display:none;" onclick="setStage('Revistoria', this)">🔄 Revistoria</button>
    </div>
    <div id="stage-info-text" style="margin-top:10px; font-weight:bold; color:var(--primary); font-size:0.9rem;"></div>
</div>

    <script type="module" src="script.js"></script>
</body>
</html>
